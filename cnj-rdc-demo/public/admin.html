<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administration — CNJ-RDC</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><style>
.portal{min-height:100vh;background:#f3f7fc}.portal-shell{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.portal-side{background:#061f48;color:white;padding:24px 18px;position:sticky;top:0;height:100vh}.portal-brand{display:flex;gap:10px;align-items:center;padding:0 8px 24px}.portal-brand img{width:52px;height:52px;object-fit:contain;background:white;border-radius:50%}.portal-brand strong{font-family:Montserrat;display:block}.portal-brand small{font-size:9px;color:#9eb4d3}.portal-nav{display:grid;gap:6px}.portal-nav button,.portal-nav a{border:0;background:transparent;color:#bbcae0;text-align:left;padding:11px 12px;border-radius:11px;font-weight:800;font-size:12px}.portal-nav button.active,.portal-nav button:hover,.portal-nav a:hover{background:rgba(255,255,255,.1);color:white}.portal-main{padding:28px 32px}.portal-top{display:flex;justify-content:space-between;align-items:center}.portal-top h1{font-family:Montserrat;margin:0;font-size:31px}.portal-top p{margin:3px 0;color:#6d7e94;font-size:12px}.dashboard-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.dash-card{background:white;border:1px solid #dce5f0;border-radius:17px;padding:18px}.dash-card small{font-size:9px;color:#74859b;font-weight:900}.dash-card b{display:block;font-size:27px;color:#082c63;margin-top:6px}.portal-panel{background:white;border:1px solid #dce5f0;border-radius:20px;padding:20px;margin-top:15px}.portal-panel h2{font-family:Montserrat;font-size:20px;margin:0 0 15px}.admin-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf1f6;font-size:10px}.table th{font-size:8px;color:#78879a;text-transform:uppercase}.status{padding:5px 8px;border-radius:999px;font-size:8px;font-weight:900}.status.pending{background:#fff5d7;color:#8a6500}.status.approved{background:#e9f8f0;color:#0d8a57}.status.rejected{background:#ffe9ed;color:#b51e37}.action-row{display:flex;gap:6px}.mini-btn{border:0;padding:6px 8px;border-radius:8px;font-size:8px;font-weight:900}.mini-btn.approve{background:#e7f8ef;color:#0d8a57}.mini-btn.reject{background:#ffe9ed;color:#b51e37}.auth-wall{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#061f48,#0a59b5);padding:20px}.auth-card{width:min(450px,100%);background:white;border-radius:24px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.auth-card h1{font-family:Montserrat}.auth-card p{color:#6e7f98;font-size:12px}.inline-form{display:grid;grid-template-columns:1fr 160px auto;gap:8px}.inline-form input,.inline-form select{border:1px solid #dce5f0;border-radius:10px;padding:10px}@media(max-width:960px){.portal-shell{grid-template-columns:1fr}.portal-side{position:relative;height:auto}.portal-nav{grid-template-columns:repeat(3,1fr)}.dashboard-grid{grid-template-columns:1fr 1fr}.admin-grid{grid-template-columns:1fr}.portal-main{padding:20px}}@media(max-width:580px){.dashboard-grid{grid-template-columns:1fr}.inline-form{grid-template-columns:1fr}.portal-nav{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div><div class="toast" id="toast"></div><script src="/admin.js"></script></body></html>
