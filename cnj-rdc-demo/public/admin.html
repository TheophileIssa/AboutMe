<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Back-office CMS — CNJ-RDC</title><link rel="icon" href="/assets/cnj-logo-current.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><style>
:root{--side:#061f48;--panel:#fff;--bg:#f3f7fc;--line:#dce5f0;--ink:#10213d;--muted:#6d7e94;--blue:#0b63ce;--green:#0d8a57;--red:#c92d46;--gold:#f5c52a}
*{box-sizing:border-box}.cms-app{min-height:100vh;background:var(--bg);display:grid;grid-template-columns:280px 1fr}.cms-side{background:var(--side);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.cms-brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px}.cms-brand img{width:190px;max-width:100%;height:74px;object-fit:contain;background:#fff;border-radius:12px;padding:4px}.cms-brand small{display:block;color:#9eb4d3;font-size:9px}.cms-nav{display:grid;gap:5px}.cms-nav button,.cms-nav a{border:0;background:transparent;color:#bfd0e6;text-align:left;padding:11px 12px;border-radius:11px;font:800 11px Manrope;display:flex;align-items:center;gap:9px}.cms-nav button:hover,.cms-nav button.active,.cms-nav a:hover{background:rgba(255,255,255,.1);color:#fff}.cms-nav i{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-style:normal}.cms-main{padding:26px 30px;min-width:0}.cms-top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px}.cms-top h1{font:800 30px Montserrat;margin:0}.cms-top p{margin:3px 0 0;color:var(--muted);font-size:11px}.cms-user{display:flex;align-items:center;gap:9px;background:white;border:1px solid var(--line);padding:8px 10px;border-radius:13px}.cms-user span{width:34px;height:34px;border-radius:10px;background:#eaf3ff;color:var(--blue);display:grid;place-items:center;font-weight:900}.cms-user b{font-size:10px}.cms-user small{display:block;color:var(--muted);font-size:8px}.cms-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}.cms-kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.cms-kpi small{font-size:8px;color:var(--muted);font-weight:900}.cms-kpi b{font:800 25px Montserrat;display:block;color:#082c63;margin-top:5px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px;margin-bottom:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panel-head h2{font:800 18px Montserrat;margin:0}.panel-head p{font-size:10px;color:var(--muted);margin:3px 0 0}.btn-sm{border:0;border-radius:10px;padding:9px 11px;font-weight:900;font-size:9px}.primary{background:#082c63;color:white}.light{background:#edf4ff;color:var(--blue)}.danger{background:#ffe8ed;color:var(--red)}.success{background:#e8f8ef;color:var(--green)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:grid;gap:6px}.field label{font-size:9px;font-weight:900;color:#65758d}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;outline:0;background:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:#79a8e8;box-shadow:0 0 0 3px #edf5ff}.table-wrap{overflow:auto}.cms-table{width:100%;border-collapse:collapse}.cms-table th,.cms-table td{text-align:left;padding:10px 8px;border-bottom:1px solid #edf1f6;font-size:9px;vertical-align:top}.cms-table th{text-transform:uppercase;color:#718198;font-size:7px}.status{display:inline-flex;padding:5px 7px;border-radius:999px;font-size:8px;font-weight:900}.status.pending{background:#fff4d5;color:#8b6600}.status.approved,.status.verified{background:#e8f8ef;color:#0d8a57}.status.rejected{background:#ffe8ed;color:#c92d46}.actions{display:flex;gap:5px;flex-wrap:wrap}.media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.media-item{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.media-item img{width:100%;height:150px;object-fit:cover;display:block;background:#eef2f7}.media-item>div{padding:10px}.media-item b{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.media-item small{font-size:8px;color:var(--muted)}.media-item .actions{margin-top:8px}.upload-drop{border:2px dashed #b8cae0;border-radius:16px;padding:20px;text-align:center;background:#f8fbff}.upload-drop input{margin-top:10px}.page-preview{height:190px;border-radius:16px;background:#0b3e80 center/cover no-repeat;position:relative;overflow:hidden;color:white;margin-bottom:14px}.page-preview:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,30,69,.92),rgba(5,30,69,.28))}.page-preview>div{position:absolute;z-index:2;left:20px;right:20px;bottom:18px}.page-preview h3{font:800 24px Montserrat;margin:0}.page-preview p{font-size:10px;max-width:560px}.section-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}.section-tabs button{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:999px;font-size:9px;font-weight:900}.section-tabs button.active{background:#082c63;color:#fff;border-color:#082c63}.edit-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px}.edit-card h3{font:800 13px Montserrat;margin:0 0 10px}.auth-wall{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#061f48,#0a59b5);padding:20px}.auth-card{width:min(450px,100%);background:white;border-radius:24px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.auth-card h1{font:800 30px Montserrat}.auth-card p{color:var(--muted);font-size:11px}.notice{padding:10px 12px;border-radius:11px;background:#fff7da;color:#765800;font-size:9px;margin-bottom:13px}.toast{position:fixed;right:20px;bottom:20px;background:#061f48;color:white;padding:12px 15px;border-radius:11px;opacity:0;transform:translateY(12px);transition:.2s;z-index:99;font-size:10px}.toast.show{opacity:1;transform:none}@media(max-width:1050px){.cms-app{grid-template-columns:1fr}.cms-side{position:relative;height:auto}.cms-nav{grid-template-columns:repeat(4,1fr)}.cms-kpis{grid-template-columns:repeat(3,1fr)}.media-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.cms-main{padding:18px}.cms-nav{grid-template-columns:1fr 1fr}.cms-kpis,.grid2,.grid3{grid-template-columns:1fr}.media-grid{grid-template-columns:1fr 1fr}.cms-top{align-items:flex-start;flex-direction:column}}</style>
<style>
.cms-brand img{width:230px;height:92px;object-fit:contain;background:#fff}
.auth-card>img{width:330px!important;max-width:100%!important;height:auto!important}
.cms-page-frame{width:100%;height:560px;border:1px solid #dce5f0;border-radius:16px;background:#fff}
.cms-edit-group{border:1px solid #e2e9f2;border-radius:14px;margin-top:12px;overflow:hidden;background:#fbfdff}
.cms-edit-group summary{cursor:pointer;padding:13px 15px;font:800 11px Montserrat;color:#082c63;background:#f2f7fd}
.cms-edit-list{display:grid;gap:8px;padding:10px}
.cms-edit-row{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;padding:10px;border:1px solid #e5ebf3;border-radius:12px;background:#fff}
.cms-edit-row--image{grid-template-columns:120px 1fr;align-items:center}
.cms-edit-index{width:38px;height:38px;border-radius:10px;background:#edf5ff;color:#0b63ce;display:grid;place-items:center;font-size:9px;font-weight:900}
.cms-edit-main{display:grid;gap:5px;min-width:0}
.cms-edit-main small{font-size:8px;color:#60738d;font-weight:900}
.cms-edit-main input,.cms-edit-main textarea{width:100%;border:1px solid #dce5f0;border-radius:9px;padding:9px 10px;font:500 10px Manrope}
.cms-edit-main em{font-style:normal;font-size:7px;color:#9aa8ba;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cms-image-thumb{height:84px;border-radius:10px;overflow:hidden;background:#eef3f8;border:1px solid #e1e8f0}
.cms-image-thumb img{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:700px){
  .cms-brand img{width:205px;height:80px}
  .cms-page-frame{height:430px}
  .cms-edit-row,.cms-edit-row--image{grid-template-columns:1fr}
  .cms-image-thumb{height:160px}
}
</style>
<style>
.cms-section-list{display:grid;gap:8px;padding:10px}
.cms-section-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 12px;background:#fff;border:1px solid #e5ebf3;border-radius:11px}
.cms-section-row b{display:block;font-size:10px;color:#10213d}.cms-section-row small{display:block;font-size:7px;color:#95a3b5;margin-top:3px;max-width:660px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cms-switch{display:flex;align-items:center;gap:7px;cursor:pointer;flex:0 0 auto}.cms-switch input{display:none}.cms-switch span{width:38px;height:22px;border-radius:999px;background:#cad5e2;position:relative;transition:.2s}.cms-switch span:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:white;left:3px;top:3px;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:.2s}.cms-switch input:checked+span{background:#0b63ce}.cms-switch input:checked+span:after{left:19px}.cms-switch em{font-style:normal;font-size:8px;color:#64758c;font-weight:900}
.cms-block-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cms-block-card{display:grid;grid-template-columns:150px 1fr;border:1px solid #e1e8f0;border-radius:14px;overflow:hidden;background:#fff}.cms-block-card__thumb{min-height:135px;background:#eef4fa;display:grid;place-items:center}.cms-block-card__thumb img{width:100%;height:100%;object-fit:cover}.cms-block-card__thumb span{font:800 10px Montserrat;color:#668}.cms-block-card__body{padding:13px;min-width:0}.cms-block-card__body small{font-size:8px;color:#0b63ce;font-weight:900}.cms-block-card__body h3{font:800 13px Montserrat;margin:6px 0}.cms-block-card__body p{font-size:9px;color:#6d7e94;line-height:1.5}.cms-block-card button:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:900px){.cms-block-list{grid-template-columns:1fr}.cms-block-card{grid-template-columns:110px 1fr}}
@media(max-width:600px){.cms-section-row{align-items:flex-start;flex-direction:column}.cms-block-card{grid-template-columns:1fr}.cms-block-card__thumb{height:180px}}
</style></head>
<body><div id="app"></div><div class="toast" id="toast"></div><script src="/admin.js"></script></body></html>
