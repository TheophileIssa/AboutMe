<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Espace Jeunes — CNJ-RDC</title><link rel="icon" href="/assets/cnj-logo-current.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><style>
.portal{min-height:100vh;background:#f3f7fc}.portal-shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.portal-side{background:#061f48;color:white;padding:24px 18px;position:sticky;top:0;height:100vh}.portal-brand{display:flex;gap:10px;align-items:center;padding:0 8px 24px}.portal-brand img{width:52px;height:52px;object-fit:contain;background:white;border-radius:50%}.portal-brand strong{font-family:Montserrat;display:block}.portal-brand small{font-size:9px;color:#9eb4d3}.portal-nav{display:grid;gap:6px}.portal-nav button,.portal-nav a{border:0;background:transparent;color:#bbcae0;text-align:left;padding:11px 12px;border-radius:11px;font-weight:800;font-size:12px}.portal-nav button.active,.portal-nav button:hover,.portal-nav a:hover{background:rgba(255,255,255,.1);color:white}.portal-main{padding:28px 32px}.portal-top{display:flex;justify-content:space-between;align-items:center;gap:15px}.portal-top h1{font-family:Montserrat;margin:0;font-size:31px}.portal-top p{margin:3px 0;color:#6d7e94;font-size:12px}.profile-chip{display:flex;align-items:center;gap:10px;background:white;padding:8px 10px;border:1px solid #dce5f0;border-radius:13px}.profile-chip span{width:34px;height:34px;border-radius:10px;background:#eaf3ff;color:#0b63ce;display:grid;place-items:center;font-weight:900}.dashboard-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.dash-card{background:white;border:1px solid #dce5f0;border-radius:17px;padding:18px}.dash-card small{font-size:9px;color:#74859b;font-weight:900}.dash-card b{display:block;font-size:27px;color:#082c63;margin-top:6px}.portal-panel{background:white;border:1px solid #dce5f0;border-radius:20px;padding:20px;margin-top:15px}.portal-panel h2{font-family:Montserrat;font-size:20px;margin:0 0 15px}.portal-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.dash-opp{padding:14px;border:1px solid #e0e7f0;border-radius:14px;margin-bottom:8px}.dash-opp small{font-size:9px;color:#0b63ce;font-weight:900}.dash-opp h3{font-family:Montserrat;font-size:14px;margin:5px 0}.dash-opp p{font-size:10px;color:#6e7f98}.dash-opp button{border:0;background:none;color:#0b63ce;font-size:10px;font-weight:900;padding:0}.app-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid #edf1f6}.app-row:last-child{border:0}.app-row b{font-size:12px}.app-row span{font-size:9px;color:#6e7f98}.status{background:#e7f8ef;color:#0d8a57;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900}.auth-wall{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#061f48,#0a59b5);padding:20px}.auth-card{width:min(450px,100%);background:white;border-radius:24px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.auth-card h1{font-family:Montserrat}.auth-card p{color:#6e7f98;font-size:12px}@media(max-width:900px){.portal-shell{grid-template-columns:1fr}.portal-side{height:auto;position:relative}.portal-nav{grid-template-columns:repeat(3,1fr)}.portal-main{padding:20px}.dashboard-grid{grid-template-columns:1fr 1fr}.portal-grid{grid-template-columns:1fr}}@media(max-width:560px){.portal-nav{grid-template-columns:1fr 1fr}.dashboard-grid{grid-template-columns:1fr}.portal-top{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="app"></div><div class="toast" id="toast"></div><script src="/youth.js"></script></body></html>
